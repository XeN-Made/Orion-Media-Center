name = "orion-usage"
main = "index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "orion-usage"
database_id = "the id `npx wrangler d1 create orion-usage` prints"

# Every night: rows older than 400 days go.
[triggers]
crons = ["17 3 * * *"]
