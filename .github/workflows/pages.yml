name: Site

on:
  # When main changes what the site is made of, and by hand (Run workflow).
  # Not on a release: the github-pages environment deploys only from main, so
  # a run on a release's tag is refused. A release pushes main first anyway.
  # Needs Settings, Pages, Source: GitHub Actions, once.
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/themes/**"
      - "sce_sys/icon0.png"
      - "tools/build-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: sh tools/build-site.sh build/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - id: deploy
        uses: actions/deploy-pages@v4
